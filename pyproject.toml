[project]
name = "youtube-lecture-server"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "jsonschema>=4.23,<5",
  "psycopg[binary]>=3.2,<4",
  "jinja2>=3.1,<4",
  "uvicorn>=0.35,<1",
  "youtube-transcript-api==1.2.4",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest-tmp"
